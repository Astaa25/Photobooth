name: Build Android APK Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Release APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK Generated and Signed
        run: |
          ls -lah android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/photobooth-himatik.apk ./photobooth-himatik.apk
          # Verifikasi sertifikat tanda tangan resmi (v1 + v2 Signature Scheme)
          jarsigner -verify ./photobooth-himatik.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photobooth-himatik-apk
          path: ./photobooth-himatik.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Photobooth HIMATIK APK"
          draft: false
          prerelease: false
          body: |
            ## 📱 Photobooth HIMATIK - Release APK Android Resmi
            
            File APK resmi ini dibuat khusus untuk tablet Android (termasuk **Redmi Pad 2 / Xiaomi HyperOS / MIUI**) yang telah ditandatangani dengan sertifikat resmi (v1 + v2 Signature Scheme) sehingga dapat langsung dipasang tanpa kendala "paket tidak valid".

            ### 🚀 Cara Pasang di Tablet (Redmi Pad 2):
            1. Unduh file **`photobooth-himatik.apk`** di bawah ini langsung dari tablet Anda.
            2. Buka file APK yang sudah diunduh &rarr; klik **Pasang / Install**.
            3. Buka aplikasi **Photobooth HIMATIK** di layar utama tablet.
            4. Masukkan alamat IP laptop operator Anda (contoh: `http://192.168.1.5:3000/booth`).
            5. Aplikasi akan langsung membuka bilik foto dalam mode Layar Penuh (Fullscreen Kiosk) tanpa Google Chrome!

            ### ✨ Keunggulan:
            - **Nama Aplikasi Resmi:** Photobooth HIMATIK
            - **Fullscreen 100%**: Tanpa address bar ataupun tab browser Chrome.
            - **Layar Selalu Menyala (Anti-Sleep)**: Layar tablet tidak akan mati di tengah antrean pengunjung.
            - **Izin Kamera Otomatis**: Kamera live view langsung aktif tanpa pop-up yang mengganggu.
          files: ./photobooth-himatik.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
