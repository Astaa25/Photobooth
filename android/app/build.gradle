plugins {
    id 'com.android.application'
}

android {
    namespace 'com.photobooth.kiosk'
    compileSdk 34

    defaultConfig {
        applicationId "com.photobooth.kiosk"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Menggunakan debug signing agar APK bisa langsung diinstall tanpa sertifikat berbayar
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Ubah nama file output APK agar rapi dan mudah dikenali
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "photobooth-tablet-kiosk-${variant.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
